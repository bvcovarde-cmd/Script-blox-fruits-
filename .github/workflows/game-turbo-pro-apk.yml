name: Build Game Turbo Pro APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: game-turbo-pro/apk-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp game-turbo-pro/apk-project/app/build/outputs/apk/debug/app-debug.apk artifact/GameTurboPro-2026.09-debug.apk
          sha256sum artifact/GameTurboPro-2026.09-debug.apk > artifact/GameTurboPro-2026.09-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameTurboPro-APK
          path: artifact/
          if-no-files-found: error
