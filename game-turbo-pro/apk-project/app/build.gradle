plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghost.gameturbo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ghost.gameturbo'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '2026.09.200'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
